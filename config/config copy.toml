########## Dataset configuration ##########
[dataset]
type = "cleaned-mini-bird"
split = "full"  # Options: "full" (arcwise_plat_full_with_diff.json) or "sql_only" (arcwise_plat_sql_only_with_diff.json)
root_path = "data/cleaned-mini-bird"
save_path = "workspace/dataset/cleaned-mini-bird/dev.pkl"
database_whitelist = [] # Empty means all databases; or specify like ["california_schools", "card_games"]
use_database_description = true

########## Vector database configuration ##########
[vector_database]
embedding_model_name_or_path = "Qwen/Qwen3-Embedding-0.6B"
use_qwen3_embedding = true
local_files_only = false
normalize_embeddings = false
device = "cpu"
store_root_path = "workspace/vector_database/cleaned-mini-bird"
max_value_length = 100
lower_meta_data = true

########## Value retrieval configuration ##########
[value_retrieval]
n_results = 5
n_parallel = 16
save_path = "workspace/value_retrieval/cleaned-mini-bird/dev.pkl"

[value_retrieval.llm]
model = "qwen3-30b"
base_url = "http://127.0.0.1:8000/v1"
api_key = "dummy"
max_tokens = 1024
temperature = 0.7
api_type = "openai"

########## Schema linking configuration ##########
[schema_linking]
n_parallel = 16
save_path = "workspace/schema_linking/cleaned-mini-bird/dev.pkl"
direct_linking_sampling_budget = 8
reversed_linking_sampling_budget = 8
value_distance_threshold = 0.02
use_caf_metadata = false

[schema_linking.llm]
model = "qwen3-30b"
base_url = "http://127.0.0.1:8000/v1"
api_key = "dummy"
max_tokens = 2048
temperature = 0.7
api_type = "openai"


########## Memory augmentation configuration ##########
[memory_augmentation]
enabled = true
save_path = "workspace/memory_augmentation/cleaned-mini-bird/schools_cards_latter50_historical_qa.pkl"

# Top-K Retrieval Strategy (Historical QA):
strategies = ["historical_qa"]

# Context Graph Strategy:
# strategies = ["context_graph"]

# whether to use memory in each stage
use_in_generation = true
use_in_revision = true
use_in_selection = true

[memory_augmentation.context_graph]
# Path to the JSONL file - UPDATE THIS PATH for your memory data
mapping_decisions_path = "workspace/memory/context_graph_memory/cleaned-mini-bird/offline_memory_augmentation.jsonl"

# Format type: "with_user_interaction" or "wo_user_interaction"
format_type = "wo_user_interaction"

# Whether to include reasoning in guidance (only for wo_user_interaction format)
include_reasoning = true

log_formatted_blocks = true

[memory_augmentation.historical_qa]
data_path = "workspace/historical_qa/cleaned-mini-bird/historical_qa.jsonl"

embedding_model_name_or_path = "Qwen/Qwen3-Embedding-0.6B"
use_qwen3_embedding = true
local_files_only = false
normalize_embeddings = false
device = "cpu"

top_k = 5
same_database_only = true

[memory_augmentation.amem_retrieval]
data_path = "workspace/memory/A-mem/cleaned-mini-bird/amem_retrieval.jsonl"
top_k = 5


########## SQL generation configuration ##########
[sql_generation]
n_parallel = 2
save_path = "workspace/sql_generation/cleaned-mini-bird/schools_cards_latter50_historical_qa.pkl"
dc_sampling_budget = 8
skeleton_sampling_budget = 8
icl_sampling_budget = 8
# NOTE: You may need to create or adapt few-shot examples for cleaned-mini-bird
icl_few_shot_examples_path = "data/cleaned-mini-bird/few_shots.json"

[sql_generation.llm]
model = "qwen3-30b"
base_url = "http://127.0.0.1:8000/v1"
api_key = "dummy"
max_tokens = 8192
temperature = 0.7
api_type = "openai"

########## SQL revision configuration ##########
[sql_revision]
n_parallel = 2
save_path = "workspace/sql_revision/cleaned-mini-bird/schools_cards_latter50_historical_qa.pkl"
checker_sampling_budget = 5

[sql_revision.llm]
model = "qwen3-30b"
base_url = "http://127.0.0.1:8000/v1"
api_key = "dummy"
max_tokens = 8192
temperature = 0.7
api_type = "openai"

########## SQL selection configuration ##########
[sql_selection]
n_parallel = 2
save_path = "workspace/sql_selection/cleaned-mini-bird/schools_cards_latter50_historical_qa.pkl"
filter_top_k_sql = 2
evaluator_sampling_budget = 16
shortcut_consistency_score_threshold = 0.6

[sql_selection.llm]
model = "qwen3-30b"
base_url = "http://127.0.0.1:8000/v1"
api_key = "dummy"
max_tokens = 8192
temperature = 0.7
api_type = "openai"
